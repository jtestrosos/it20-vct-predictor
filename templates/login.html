<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Flash Test</title>
</head>
<body>
    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="padding: 10px; margin-bottom: 10px; background-color: {% if category == 'success' %}#d4edda{% else %}#f8d7da{% endif %};">
            <strong>[{{ category.upper() }}]</strong> {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h2>Login Form</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Enter username (try 'admin')" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
